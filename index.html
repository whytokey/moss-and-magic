function ellipse(c,x,y,rx,ry,fill,rot=0){c.beginPath();c.ellipse(x,y,rx,ry,rot,0,Math.PI*2);c.fillStyle=fill;c.fill()}

if(t===2||t===6||t===8){const count=t===2?5:t===6?7:8;for(let i=0;i<count;i++){const a=i/count*Math.PI*2-Math.PI/2;ellipse(c,Math.cos(a)*r*.84,Math.sin(a)*r*.84,r*.26,r*.16,t===8?'#eaf1da':s.accent,a)}if(t===8){ellipse(c,0,-r*.96,r*.2,r*.24,'#ececcb');ellipse(c,r*.07,-r*1.03,r*.15,r*.17,s.c)}}

if(t===9||t===10){for(let i=0;i<7;i++){const a=Math.PI+i/6*Math.PI;ellipse(c,Math.cos(a)*r*.76,Math.sin(a)*r*.8,r*.26,r*.13,i%2?'#d8d99e':'#6c934f',a+.8)}if(t===10){c.strokeStyle='#e9d49a';c.lineWidth=r*.065;for(const sign of [-1,1]){c.beginPath();c.moveTo(sign*r*.46,-r*.6);c.lineTo(sign*r*.65,-r*1.1);c.lineTo(sign*r*.5,-r*1.3);c.moveTo(sign*r*.65,-r*1.1);c.lineTo(sign*r*.92,-r*1.12);c.stroke()}ellipse(c,0,-r*.78,r*.12,r*.13,'#f7e8ab')}}

function forest(c,w,h,skin,phase=0){const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,skin.a);g.addColorStop(1,skin.b);c.fillStyle=g;c.fillRect(0,0,w,h);ellipse(c,w*.7,h*.19,w*.1,w*.1,skin.c+'22');for(let i=0;i<7;i++){const x=(i*153.7%w),height=h*(.65+(i%3)*.1);c.fillStyle='#0c291c30';c.beginPath();c.moveTo(x-25,h);c.bezierCurveTo(x-5,h*.6,x+12,h*.45,x-10,h-height);c.lineTo(x+9,h-height);c.bezierCurveTo(x+36,h*.5,x+24,h*.7,x+36,h);c.fill();for(let j=0;j<5;j++){const y=h-height+j*height*.19;leaf(c,x+10,y,w*.09,'#b8d3930c',j%2?.5:-.5)}}for(let i=0;i<27;i++){const x=(i*97.3+25)%w,y=(i*139.7+35)%(h*.9);ellipse(c,x,y,1.3+(i%3)*.5,1.3+(i%3)*.5,skin.c+(i%2?'22':'44'))}c.fillStyle='#17382770';c.beginPath();c.moveTo(0,h);c.lineTo(0,h*.94);c.bezierCurveTo(w*.3,h*.82,w*.7,h,w,h*.9);c.lineTo(w,h);c.fill()}
function drawHero(canvas){if(!canvas)return;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;forest(c,w,h,theme());ellipse(c,w*.5,h*.82,w*.37,h*.075,'#102f2760');drawSpirit(c,w*.5,h*.54,w*.2,10,-.08);drawSpirit(c,w*.22,h*.77,w*.075,3,-.15);drawSpirit(c,w*.78,h*.74,w*.092,7,.15);drawSpirit(c,w*.39,h*.85,w*.055,1,-.2);drawSpirit(c,w*.67,h*.87,w*.045,0,.15);for(let i=0;i<12;i++){const x=(i*141+80)%w,y=(i*93+40)%(h*.7);ellipse(c,x,y,2,2,'#ffe3a780')}}
function drawBoard(now){const c=boardCtx;c.clearRect(0,0,W,H);const skin=theme();forest(c,W,H,skin);c.save();if(run?.shake)c.translate(Math.sin(now*80)*run.shake*.3,Math.cos(now*61)*run.shake*.2);c.fillStyle='#102a2290';c.beginPath();c.roundRect(LEFT-8,LINE-8,RIGHT-LEFT+16,FLOOR-LINE+24,18);c.fill();c.strokeStyle=skin.c+'35';c.lineWidth=2;c.beginPath();c.moveTo(LEFT-7,155);c.lineTo(LEFT-7,FLOOR+8);c.quadraticCurveTo(LEFT-7,FLOOR+16,LEFT+7,FLOOR+16);c.lineTo(RIGHT-7,FLOOR+16);c.quadraticCurveTo(RIGHT+7,FLOOR+16,RIGHT+7,FLOOR+5);c.lineTo(RIGHT+7,155);c.stroke();
const danger=run&&run.overflow>.15;c.strokeStyle=danger?'#f29b7b':'#e89e7670';c.lineWidth=danger?2:1;c.setLineDash([6,7]);c.beginPath();c.moveTo(LEFT,LINE);c.lineTo(RIGHT,LINE);c.stroke();c.setLineDash([]);c.font='10px Trebuchet MS';c.fillStyle=danger?'#ffbf94':'#d5af8870';c.textAlign='right';c.fillText(danger?'! '+Math.max(0,(2.3-run.overflow)).toFixed(1):'· · ·',RIGHT-4,LINE-10);
if(run){for(const b of run.balls)drawSpirit(c,b.x,b.y,SPIRITS[b.t].r,b.t,b.rot);if(!run.ended&&!run.loss){const r=SPIRITS[run.current].r,x=Math.max(LEFT+r,Math.min(RIGHT-r,run.aim));c.globalAlpha=.5;c.strokeStyle=skin.c;c.lineWidth=1;c.setLineDash([3,7]);c.beginPath();c.moveTo(x,86+r);c.lineTo(x,FLOOR);c.stroke();c.setLineDash([]);c.globalAlpha=1;drawSpirit(c,x,68,r,run.current,Math.sin(now*1.8)*.06);if(run.cooldown>0){c.globalAlpha=.3;ellipse(c,x,68,r+5,r+5,skin.a);c.globalAlpha=1}}for(const p of run.particles){c.globalAlpha=Math.min(1,p.life*1.4);ellipse(c,p.x,p.y,p.r,p.r,p.color)}c.globalAlpha=1;for(const f of run.floaters){c.globalAlpha=Math.max(0,f.life);c.font='bold 15px Trebuchet MS';c.textAlign='center';c.fillStyle=f.color;c.fillText(f.label,f.x,f.y)}c.globalAlpha=1;if(run.mode==='daily'){c.fillStyle='#d6deb680';c.font='10px Trebuchet MS';c.textAlign='center';c.fillText(text('restartNote'),W/2,30)}}c.restore()}
function updateHUD(full=false){if(!run)return;$('score').textContent=fmt(run.score);$('game-merges').textContent=fmt(run.merges);$('game-coins').textContent=fmt(profile.coins);$('game-progress').textContent=run.mode==='daily'?Math.max(0,180-Math.floor(run.time))+' '+text('seconds'):run.mode==='journey'?text('chapterShort')+' '+run.chapter:'∞';const g=chapterGoal(run.chapter);$('goal-bar').style.width=(run.mode==='journey'?Math.min(100,run.score/g.score*100):run.mode==='daily'?Math.max(0,(180-run.time)/180*100):run.maxTier/10*100)+'%';if(full){$('game-brand').textContent=text('brand');$('game-mode').textContent=text(run.mode);$('game-chapter').textContent=run.mode==='journey'?biome(run.chapter):text(run.mode);$('game-desc').textContent=run.mode==='journey'?text('need')+' '+spiritName(g.tier)+' · '+fmt(g.score)+' '+text('points'):run.mode==='daily'?text('dailyDesc'):text('noTimer');$('best-label').textContent=text('best');$('merge-label').textContent=text('merges');$('rank-label').textContent=text('rank');$('game-best').textContent=fmt(profile.best);$('game-rank').textContent=rank();$('game-help').textContent=text('help')+' ↗';$('score-label').textContent=text('score');$('next-label').textContent=text('next');$('goal-label').textContent=text('goal');$('goal-title').textContent=run.mode==='journey'?spiritName(g.tier):text(run.mode==='daily'?'dayGoal':'classicGoal');$('goal-desc').textContent=run.mode==='journey'?fmt(run.score)+' / '+fmt(g.score)+' · '+(run.maxTier>=g.tier?'✓':'○'):text(run.mode==='daily'?'dailyDesc':'classicGoalDesc');$('input-hint').textContent=text('input');$('controls').innerHTML=text('controls');$('coins-label').textContent=text('coins');$('sound-note').textContent=run.mode==='daily'?text('restartNote'):text('subtitle');$('pause-btn').setAttribute('aria-label',text('pause'));$('board').setAttribute('aria-label',text('title'));nextCtx.clearRect(0,0,96,96);drawSpirit(nextCtx,48,51,27,run.next,0);toolsRender();if(!$('game-chain').children.length){$('g let inputHeld=false,keys=new Set();

$('board').addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;Audio.init();if(reasons.size)return;inputHeld=true;pointerAim(e);$('board').setPointerCapture(e.pointerId);e.preventDefault()});$('board').addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||inputHeld)pointerAim(e)});$('board').addEventListener('pointerup',e=>{if(inputHeld){pointerAim(e);drop()}inputHeld=false});$('board').addEventListener('pointercancel',()=>inputHeld=false);$('board').addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(modalType){if(e.key==='Tab'){const bs=[...$('modal').querySelectorAll('button:not(:disabled)')];if(!bs.length)return;const i=bs.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();bs[bs.length-1].focus()}else if(!e.shiftKey&&i===bs.length-1){e.preventDefault();bs[0].focus()}}if(e.key==='Escape'&&!['result','overflow','help'].includes(modalType))closeModal();return}if(route!=='game')return;if(['ArrowLeft','ArrowRight',' ','Enter','Escape','1','2','3','a','d','p'].includes(e.key))e.preventDefault();if(e.repeat&&[' ','Enter','Escape','p','1','2','3'].includes(e.key))return;keys.add(e.key);Audio.init();if(e.key===' '||e.key==='Enter')drop();if(e.key==='Escape'||e.key==='p')pause();if(['1','2','3'].includes(e.key))useTool(['swap','wind','clear'][+e.key-1])});window.addEventListener('keyup',e=>keys.delete(e.key));
window.addEventListener('blur',()=>{keys.clear();inputHeld=false;block('focus',true);save()});window.addEventListener('focus',()=>block('focus',false));document.addEventListener('visibilitychange',()=>{block('hidden',document.hidden);if(document.hidden)save(true)});window.addEventListener('pagehide',()=>save(true));window.addEventListener('resize',()=>{if(route==='game')resizeBoard()});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled||adBusy)return;Audio.init();const a=btn.dataset.action,v=btn.dataset.value,ch=Number(btn.dataset.chapter||1);switch(a){case 'home':closeModal();showRoute('home');save();break;case 'save-home':save(true);closeModal();showRoute('home');break;case 'chapters':showRoute('chapters');break;case 'collection':showRoute('collection');break;case 'shop':showRoute('shop');break;case 'start':start(v,ch);break;case 'replace':closeModal();finishRun(false);closeModal();start(v,ch);break;case 'resume':resume();break;case 'settings':settings();break;case 'setting':profile[v]=!profile[v];Audio.sync();save();settings();break;case 'language':lang=lang==='ru'?'en':'ru';profile.language=lang;document.documentElement.lang=lang;document.title=text('title');save();if(route==='game')updateHUD(true);else showRoute(route);settings();break;case 'close':closeModal();break;case 'help':help();break;case 'understood':profile.tutorial=true;save();closeModal();break;case 'pause':pause();break;case 'finish-confirm':askFinish();break;case 'finish':closeModal();finishRun(false);break;case 'tool':useTool(v);break;case 'tool-ad':rewardAd(()=>{if(run&&!run.ended&&run.extras<CONFIG.rewardExtrasPerRun){run.tools[v]++;run.extras++}});break;case 'revive-ad':rewardAd(()=>revive());break;case 'revive-coins':if(profile.coins>=CONFIG.reviveCost&&run.loss&&!run.revived){profile.coins-=CONFIG.reviveCost;revive()}break;case 'double':rewardAd(()=>{if(run?.ended&&!run.doubled){profile.coins+=run.reward;run.doubled=true}});break;case 'gift':if(profile.gift.date!==dateKey()){const streak=profile.gift.date===yesterday()?Math.min(5,profile.gift.streak+1):1;profile.gift={date:dateKey(),streak};profile.coins+=40+streak*10;save(true);renderHome();toast('+'+(40+streak*10)+' ✦')}break;case 'mission':{const i=Number(v),m=missionData()[i];if(m&&m.v>=m.max&&!profile.daily.claims[i]){profile.daily.claims[i]=true;profile.coins+=m.re function loop(timestamp){const elapsed=Math.min(.08,(timestamp-(lastFrame||timestamp))/1000);lastFrame=timestamp;if(route==='game'&&run){if(!reasons.size&&!run.ended&&!run.loss&&!adBusy){const r=SPIRITS[run.current].r;if(keys.has('ArrowLeft')||keys.has('a'))run.aim-=elapsed*250;if(keys.has('ArrowRight')||keys.has('d'))run.aim+=elapsed*250;run.aim=Math.max(LEFT+r,Math.min(RIGHT-r,run.aim));acc+=elapsed;let steps=0;while(acc>=1/120&&steps<10){step(1/120);acc-=1/120;steps++}animateEffects(elapsed);snapshotClock+=elapsed;if(snapshotClock>10){snapshotClock=0;save()}}else acc=0;drawBoard(timestamp/1000);uiClock+=elapsed;if(uiClock>.2){uiClock=0;updateHUD()}}requestAnimationFrame(loop)}
